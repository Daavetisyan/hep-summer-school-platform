services:
  - type: web
    name: hep-summer-school-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hep-summer-school-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://hep-summer-school-platform.vercel.app
databases:
  - name: hep-summer-school-db
    databaseName: hep_summer_school
    user: hep_summer_school
